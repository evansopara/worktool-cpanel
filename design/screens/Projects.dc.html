<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}a:hover{color:#000000}
@media (min-width: 900px){.wc-side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div class="wc-side" style="flex:1 1 248px;background:#121212"><dc-import name="Topbar" active="projects" hint-size="100%,1000px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:28px 40px 72px;display:flex;flex-direction:column;gap:24px">

<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding:8px 0 4px">
<div style="display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:56px;line-height:1;font-weight:700;letter-spacing:-0.04em">Projects</h1>
<p style="margin:0;font-size:16px;color:#4D4A44">Manage and track your digital agency projects</p>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<label style="display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;background:#FFFFFF;min-width:260px;color:#6A665F"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input type="search" aria-label="Search projects by name" placeholder="Search projects by name" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:15px;color:#121212"></label>
<button type="button" style="display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border:0;border-radius:999px;background:#FFD43B;color:#121212;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New project</button>
</div>
</header>

<section aria-label="Project health" style="display:flex;flex-wrap:wrap;background:#FFFFFF;border-radius:28px;overflow:hidden">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="flex:1 1 240px;display:flex;align-items:center;gap:20px;padding:26px 28px;border-right:1px solid #ECEAE4">
<span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:60px;line-height:0.9;font-weight:700;letter-spacing:-0.04em;color:{{s.c}}">{{s.value}}</span>
<span style="display:flex;flex-direction:column;gap:3px"><span style="font-size:16px;font-weight:700">{{s.label}}</span><span style="font-size:13.5px;color:#6A665F">{{s.note}}</span></span>
</div>
</sc-for>
</section>

<div role="group" aria-label="Category" style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.on}}" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:{{c.bg}};color:{{c.fg}}">{{c.label}}<span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;opacity:0.75">{{c.n}}</span></button>
</sc-for>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display:flex;flex-direction:column;gap:14px;padding-top:8px">
<div style="display:flex;align-items:baseline;gap:12px"><h2 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em">{{g.name}}</h2><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:14px;font-weight:600;color:#6A665F">{{g.count}} projects</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">
<sc-for list="{{g.items}}" as="p" hint-placeholder-count="4">
<a href="ProjectDetail.dc.html" style="display:flex;flex-direction:column;gap:16px;padding:18px;min-height:200px;box-sizing:border-box;border-radius:24px;background:#FFFFFF;text-decoration:none;color:#121212">
<span style="display:flex;justify-content:space-between;align-items:flex-start">
<span style="width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px;font-weight:700;background:{{g.tile}};color:{{g.tileFg}}">{{p.ini}}</span>
<span style="font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:{{p.sbg}};color:{{p.sfg}}">{{p.status}}</span>
</span>
<span style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="font-size:18px;font-weight:700;letter-spacing:-0.01em">{{p.name}}</span><span style="font-size:13.5px;color:{{p.noteFg}};font-weight:{{p.noteW}}">{{p.note}}</span></span>
<sc-if value="{{p.bar}}" hint-placeholder-val="{{ true }}"><span style="display:flex;align-items:center;gap:10px"><span style="flex:1;height:6px;border-radius:999px;background:#121212"></span><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;font-weight:600">100%</span></span></sc-if>
</a>
</sc-for>
<a href="Projects.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:200px;border-radius:24px;border:1.5px dashed #CFCAC0;text-decoration:none;color:#4D4A44;font-size:15px;font-weight:600"><span style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>View all {{g.count}}</a>
</div>
</section>
</sc-for>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    function chip(l, n, on) { return { label: l, n: n, on: on ? 'true' : 'false', bg: on ? '#121212' : '#FFFFFF', fg: on ? '#FFFFFF' : '#4D4A44' }; }
    function done(name, ini) { return { name: name, ini: ini, status: 'Completed', sbg: '#E2F2E7', sfg: '#1F7A4A', note: 'Website Development', noteFg: '#6A665F', noteW: '400', bar: true }; }
    function pend(name, ini, cat, flag) { return { name: name, ini: ini, status: 'Pending', sbg: '#FCF0CC', sfg: '#8A5A00', note: flag, noteFg: '#8A5A00', noteW: '600', bar: false }; }
    return {
      stats: [
        { value: '42', label: 'Overdue', note: 'Projects past deadline', c: '#C0362C' },
        { value: '5', label: 'Urgent attention', note: 'No activity for 10+ days', c: '#B07400' },
        { value: '0', label: 'Completed this week', note: 'Projects finished recently', c: '#1F7A4A' }
      ],
      chips: [ chip('All', '', true), chip('Website Development', '7', false), chip('DPL Outright', '16', false), chip('DPL Partnership', '8', false) ],
      groups: [
        { name: 'Website Development', count: '7', tile: '#FFD43B', tileFg: '#121212', items: [ done('QueenbodySecret', 'QS'), done('TopMart', 'TM'), done('Oladoyin taiwo', 'OT'), done('Adan Idet', 'AI') ] },
        { name: 'DPL Outright', count: '16', tile: '#121212', tileFg: '#FFD43B', items: [ pend('Temitope Oyewole', 'TO', 'DPL Outright', 'No tasks assigned'), pend('Dr Gloria Esoimeme', 'GE', 'DPL Outright', 'No work activity for 1+ week') ] },
        { name: 'DPL Partnership', count: '8', tile: '#DCE6F7', tileFg: '#1E4797', items: [ pend('SALAMAT', 'SA', 'DPL Partnership', 'No work activity for 1+ week') ] }
      ]
    };
  }
}
</script>
</body>
</html>
