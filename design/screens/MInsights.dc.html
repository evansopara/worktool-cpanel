<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div style="position:absolute;left:0;bottom:0;z-index:2"><dc-import name="MTabBar" active="more" hint-size="390px,96px"></dc-import></div>
<div style="height:844px;overflow-y:auto;box-sizing:border-box;padding:52px 18px 120px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;gap:10px">
<a href="MMore.dc.html" aria-label="Back to More" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin:0;flex:1;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;line-height:1;font-weight:700;letter-spacing:-0.04em">Insights</h1>
<button type="button" aria-label="Export report" style="width:44px;height:44px;border:0;border-radius:50%;background:#FFFFFF;color:#121212;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg></button>
</div>

<div role="tablist" aria-label="Reports" style="display:flex;padding:5px;border-radius:999px;background:#FFFFFF">
<button type="button" role="tab" aria-selected="true" style="flex:1;height:40px;border:0;border-radius:999px;background:#121212;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600">KPI report</button>
<button type="button" role="tab" aria-selected="false" style="flex:1;height:40px;border:0;border-radius:999px;background:transparent;color:#4D4A44;font-family:inherit;font-size:14px;font-weight:600">Estimate drift</button>
</div>

<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><label style="flex:none;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 14px;border-radius:999px;background:#FFFFFF;font-size:12.5px;font-weight:600;color:#6A665F">{{f.k}}<select style="height:40px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:#121212"><option>{{f.v}}</option></select></label></sc-for>
</div>

<section aria-labelledby="mi-h" style="padding:20px;border-radius:26px;background:#121212;color:#FFFFFF;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:12px"><span style="flex:none;width:42px;height:42px;border-radius:50%;background:#FFD43B;color:#121212;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">MI</span><div style="display:flex;flex-direction:column;gap:1px"><h2 id="mi-h" style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700">Daily hours — Mirakl</h2><span style="font-size:12.5px;color:#A8A49C">September 1 – 30</span></div></div>
<div role="img" aria-label="Bar chart of Mirakl’s daily hours in September; busiest days Sep 2 and Sep 7, smaller peaks Sep 1, 3, 4, 24, 25 and 29" style="display:flex;flex-direction:column;gap:8px">
<div style="height:170px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid #3A3936"><sc-for list="{{bars}}" as="b" hint-placeholder-count="30"><span style="flex:1;border-radius:4px 4px 1px 1px;height:{{b.h}};background:{{b.c}}"></span></sc-for></div>
<div style="display:flex;justify-content:space-between;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#A8A49C"><span>1</span><span>8</span><span>15</span><span>22</span><span>30</span></div>
</div>
</section>

<div role="tablist" aria-label="Breakdown" style="display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px">
<button type="button" role="tab" aria-selected="true" style="flex:none;height:40px;padding:0 16px;border:0;border-radius:999px;background:#121212;color:#FFFFFF;font-family:inherit;font-size:13.5px;font-weight:600">Daily productivity</button>
<button type="button" role="tab" aria-selected="false" style="flex:none;height:40px;padding:0 16px;border:0;border-radius:999px;background:#FFFFFF;color:#4D4A44;font-family:inherit;font-size:13.5px;font-weight:600">Productivity score</button>
<button type="button" role="tab" aria-selected="false" style="flex:none;height:40px;padding:0 16px;border:0;border-radius:999px;background:#FFFFFF;color:#4D4A44;font-family:inherit;font-size:13.5px;font-weight:600">Staff summary</button>
</div>
<div style="min-height:140px;border-radius:24px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:14px;font-weight:600;color:#6A665F">[Daily productivity details for the selected employee and range]</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var v = [0.32, 0.96, 0.62, 0.48, 0.02, 0.02, 1, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.36, 0.5, 0.12, 0.02, 0.02, 0.22, 0.02];
    return {
      filters: [ { k: 'Dept', v: 'All' }, { k: 'Employee', v: 'Mirakl' }, { k: 'Range', v: 'Last month' } ],
      bars: v.map(function (x) { return { h: Math.max(x * 100, 2) + '%', c: x > 0.05 ? '#FFD43B' : '#3A3936' }; })
    };
  }
}
</script>
</body>
</html>
