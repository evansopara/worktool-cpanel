<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}a:hover{color:#000000}
@media (min-width: 900px){.wc-side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div class="wc-side" style="flex:1 1 248px;background:#121212"><dc-import name="Topbar" active="inbox" hint-size="100%,1000px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:20px 40px 48px;display:flex;flex-direction:column;gap:18px">

<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:48px;line-height:1;font-weight:700;letter-spacing:-0.04em">Inbox</h1>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<div role="tablist" aria-label="Inbox sections" style="display:flex;gap:2px;padding:5px;border-radius:999px;background:#FFFFFF">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="height:40px;padding:0 20px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</button>
</sc-for>
</div>
<button type="button" style="display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 22px;border:0;border-radius:999px;background:#FFD43B;color:#121212;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>{{newLabel}}</button>
</div>
</header>

<sc-if value="{{isChats}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;gap:16px;min-height:740px">
<aside aria-label="Conversations" style="flex:1 1 300px;max-width:100%;display:flex;flex-direction:column;gap:12px">
<label style="display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;background:#FFFFFF;color:#6A665F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input type="search" aria-label="Search people and chats" placeholder="Search people and chats" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:14.5px;color:#121212"></label>
<div style="flex:1;overflow-y:auto;max-height:680px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:4px">
<p style="margin:0;padding:4px 12px;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#6A665F">{{sec.label}}</p>
<sc-for list="{{sec.items}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-current="{{c.cur}}" style="display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border:0;border-radius:20px;text-align:left;font-family:inherit;cursor:pointer;background:{{c.bg}};color:{{c.fg}}">
<span style="flex:none;width:40px;height:40px;border-radius:{{c.radius}};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:{{c.abg}};color:{{c.afg}}">{{c.ini}}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.title}}</span><span style="flex:none;font-size:12px;opacity:0.7">{{c.time}}</span></span><span style="font-size:13px;opacity:0.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.sub}}</span></span>
</button>
</sc-for>
</div>
</sc-for>
</div>
</aside>
<section aria-label="Conversation" style="flex:999 1 460px;min-width:0;display:flex;flex-direction:column;background:#FFFFFF;border-radius:28px;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #ECEAE4">
<span style="flex:none;width:46px;height:46px;border-radius:{{cur.radius}};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:{{cur.abg}};color:{{cur.afg}}">{{cur.ini}}</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><h2 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.01em">{{cur.title}}</h2><span style="font-size:13px;color:#6A665F">{{cur.meta}}</span></div>
<button type="button" aria-label="Start voice call" style="width:46px;height:46px;border:0;border-radius:50%;background:#EFEDE7;color:#121212;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg></button>
<button type="button" aria-label="Start video call" style="width:46px;height:46px;border:0;border-radius:50%;background:#121212;color:#FFD43B;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5zM3 5h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg></button>
</header>
<div style="flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:14px">
<p style="align-self:center;margin:0 0 4px;font-size:12.5px;font-weight:600;color:#6A665F">{{cur.when}}</p>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
<div style="display:flex;gap:10px;align-items:flex-end;flex-direction:{{m.dir}}">
<span style="flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:{{m.abg}};color:{{m.afg}}">{{m.ini}}</span>
<div style="max-width:70%;display:flex;flex-direction:column;gap:4px;align-items:{{m.align}}"><span style="font-size:12.5px;font-weight:600;color:#4D4A44">{{m.who}} <span style="font-weight:400;color:#6A665F">{{m.time}}</span></span><span style="padding:11px 15px;font-size:15px;line-height:1.5;overflow-wrap:anywhere;border-radius:{{m.rad}};background:{{m.bg}};color:{{m.fg}}">{{m.text}}</span></div>
</div>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:10px;padding:16px 18px;border-top:1px solid #ECEAE4">
<button type="button" aria-label="Attach file" style="flex:none;width:48px;height:48px;border:0;border-radius:50%;background:#EFEDE7;color:#121212;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<label style="flex:1;display:flex;align-items:center;height:48px;padding:0 18px;border-radius:999px;background:#EFEDE7"><input type="text" aria-label="Message" placeholder="{{cur.placeholder}}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:15px"></label>
<button type="button" aria-label="Send" style="flex:none;width:48px;height:48px;border:0;border-radius:50%;background:#FFD43B;color:#121212;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</section>
</div>
</sc-if>

<sc-if value="{{isMemos}}" hint-placeholder-val="{{ false }}">
<section aria-label="Memos" style="display:flex;flex-direction:column;gap:14px">
<div role="group" aria-label="Memo type" style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" aria-pressed="true" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:#121212;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">All memos</button>
<button type="button" aria-pressed="false" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:#FFFFFF;color:#4D4A44;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Individual</button>
<button type="button" aria-pressed="false" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:#FFFFFF;color:#4D4A44;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Department</button>
<button type="button" aria-pressed="false" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:#FFFFFF;color:#4D4A44;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Broadcast</button>
</div>
<sc-for list="{{memos}}" as="m" hint-placeholder-count="3">
<article style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:22px 26px;border-radius:24px;background:#FFFFFF">
<span style="flex:none;width:52px;height:52px;border-radius:16px;background:{{m.bg}};color:{{m.fg}};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM3 7l9 6 9-6"></path></svg></span>
<div style="flex:1 1 320px;display:flex;flex-direction:column;gap:6px"><h2 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.01em">{{m.title}}</h2><p style="margin:0;font-size:14px;color:#4D4A44">Individual · From Olubukola Ige · To {{m.to}}</p></div>
<span style="font-size:13.5px;color:#6A665F">{{m.date}}</span>
<button type="button" style="height:44px;padding:0 20px;border:0;border-radius:999px;background:#EFEDE7;color:#121212;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Read memo</button>
</article>
</sc-for>
</section>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'chats', id: 'yakubu' }; }
  renderVals() {
    var self = this, tab = this.state.tab, sel = this.state.id;
    function mk(id, label) { var on = tab === id; return { label: label, sel: on ? 'true' : 'false', bg: on ? '#121212' : 'transparent', fg: on ? '#FFFFFF' : '#4D4A44', pick: function () { self.setState({ tab: id }); } }; }
    var pal = [['#FFD43B', '#121212'], ['#121212', '#FFD43B'], ['#DCE6F7', '#1E4797'], ['#E2F2E7', '#1F7A4A'], ['#FCF0CC', '#8A5A00']];
    function conv(id, title, sub, time, ini, dm, i, extra) {
      var on = id === sel;
      return Object.assign({ id: id, title: title, sub: sub, time: time, ini: ini, radius: dm ? '50%' : '14px', abg: pal[i % 5][0], afg: pal[i % 5][1],
        bg: on ? '#121212' : 'transparent', fg: on ? '#FFFFFF' : '#121212', cur: on ? 'true' : 'false', pick: function () { self.setState({ id: id }); } }, extra);
    }
    var general = conv('general', 'General channel', 'OLAEGBE: Noted', '9 mo', '#', false, 0, { meta: 'Everyone at WC Digital', when: '9 months ago', placeholder: 'Message everyone' });
    var qbs = conv('qbs', 'QueenbodySecret', 'Sandra Mike: What is the update?', '11:02', 'QS', false, 1, { meta: 'Project group chat · 12 members', when: 'Today', placeholder: 'Message QueenbodySecret' });
    var yakubu = conv('yakubu', 'Yakubu Halilullah Omeiza', 'Kindly ignore. I’ve gotten a feedback.', '10 mo', 'YH', true, 2, { meta: 'Staff', when: '10 months ago', placeholder: 'Message Yakubu' });
    var people = [['Adeleke Toyin', 'Project Manager', 'AT'], ['Adeyemo Titilope', 'Customer Support Officer', 'AT'], ['Aliyah Yisau', 'Project Manager', 'AY'], ['Asheoluwa Oke', 'Staff', 'AO'], ['Blank account', 'Staff', 'BA'], ['Dummy teamlead', 'Team Lead', 'DT'], ['Dummy pm', 'Project Manager', 'DP'], ['Emmanuel Evans', 'Staff', 'EE'], ['Enyojo Wisdom Etu', 'Intern', 'EW'], ['Godwin Joel', 'Intern', 'GJ']]
      .map(function (p, i) { return conv('p' + i, p[0], p[1], '', p[2], true, i + 3, { meta: p[1], when: 'Start a conversation', placeholder: 'Message ' + p[0].split(' ')[0] }); });
    var all = [general, qbs, yakubu].concat(people);
    var cur = all.filter(function (c) { return c.id === sel; })[0] || yakubu;
    function them(who, ini, i, time, text) { return { who: who, ini: ini, time: time, text: text, abg: pal[i % 5][0], afg: pal[i % 5][1], bg: '#F2F0EB', fg: '#121212', dir: 'row', align: 'flex-start', rad: '6px 20px 20px 20px' }; }
    function mine(time, text) { return { who: 'You', ini: 'OI', time: time, text: text, abg: '#121212', afg: '#FFD43B', bg: '#121212', fg: '#FFFFFF', dir: 'row-reverse', align: 'flex-end', rad: '20px 6px 20px 20px' }; }
    var threads = {
      general: [ mine('', 'Noted'), them('Yakubu', 'YH', 2, '', 'Noted'), them('Phillip', 'PE', 3, '', 'ACKNOWLEDGED'), them('Jamiu', 'JI', 4, '', 'Noted'), them('Sandra', 'SM', 0, '', 'Acknowledged'), them('OLAEGBE', 'OH', 1, '', 'Noted') ],
      qbs: [ them('Sandra Mike', 'SM', 0, '9:46 AM', 'Hi @Shittu Mubaraq'), them('Sandra Mike', 'SM', 0, '9:47 AM', 'Can we start with the SMTP for this site? https://queenbodysecret.com/'), them('Shittu Mubaraq', 'SM', 1, '10:07 AM', 'Good morning,'), them('Shittu Mubaraq', 'SM', 1, '10:07 AM', 'What do you want to achieve?'), them('Sandra Mike', 'SM', 0, '11:01 AM', '@Idiong Idongesit'), them('Sandra Mike', 'SM', 0, '11:02 AM', 'What is the update?') ],
      yakubu: [ them('Yakubu', 'YH', 2, '', 'Good morning ma'), them('Yakubu', 'YH', 2, '', 'I trust you are good.'), them('Yakubu', 'YH', 2, '', 'I received a notification that I was assigned a task but no new task reflected on my dashboard. I have reached out to Linda but I’m yet to get a feedback.'), them('Yakubu', 'YH', 2, '', 'Kindly ignore. I’ve gotten a feedback.') ]
    };
    return {
      tabs: [ mk('chats', 'Chats'), mk('memos', 'Memos') ],
      isChats: tab === 'chats', isMemos: tab === 'memos',
      newLabel: tab === 'memos' ? 'New memo' : 'New message',
      sections: [ { label: 'Channels', items: [general] }, { label: 'Project chats', items: [qbs] }, { label: 'Direct messages', items: [yakubu].concat(people) } ],
      cur: cur, msgs: threads[sel] || [],
      memos: [
        { title: 'Warning', to: '—', date: 'Mar 4, 2026 · 3:50 PM', bg: '#FBE7E4', fg: '#C0362C' },
        { title: 'MISSED TASK DEADLINE', to: '—', date: 'Jan 16, 2026 · 3:31 PM', bg: '#FCF0CC', fg: '#8A5A00' },
        { title: 'MISSED TASKS DEADLINES', to: 'Asheoluwa Oke', date: 'Jan 16, 2026 · 3:28 PM', bg: '#FCF0CC', fg: '#8A5A00' }
      ]
    };
  }
}
</script>
</body>
</html>
