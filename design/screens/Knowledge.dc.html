<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}a:hover{color:#000000}
@media (min-width: 900px){.wc-side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div class="wc-side" style="flex:1 1 248px;background:#121212"><dc-import name="Topbar" active="library" hint-size="100%,1000px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:28px 40px 72px;display:flex;flex-direction:column;gap:22px">

<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding:8px 0 4px">
<div style="display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:56px;line-height:1;font-weight:700;letter-spacing:-0.04em">Library</h1>
<p style="margin:0;font-size:16px;color:#4D4A44">Standard operating procedures for everyone, and notes just for you</p>
</div>
<label style="display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;background:#FFFFFF;min-width:280px;color:#6A665F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input type="search" aria-label="Search SOPs and notes" placeholder="Search SOPs and notes" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:14.5px;color:#121212"></label>
</header>

<section aria-labelledby="h-sop" style="display:flex;flex-wrap:wrap;align-items:center;gap:28px;padding:40px;border-radius:32px;background:#121212;color:#FFFFFF">
<div style="flex:1 1 380px;display:flex;flex-direction:column;gap:14px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#FFD43B">Standard operating procedures</p>
<h2 id="h-sop" style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:44px;line-height:1.02;font-weight:700;letter-spacing:-0.03em">No SOPs yet</h2>
<p style="margin:0;max-width:440px;font-size:16px;line-height:1.5;color:#BDB9B0">Write the first procedure so every project runs from the same playbook.</p>
<button type="button" style="align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 24px;border:0;border-radius:999px;background:#FFD43B;color:#121212;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New SOP</button>
</div>
<div aria-hidden="true" style="flex:0 1 300px;display:flex;flex-direction:column;gap:10px">
<span style="height:58px;border-radius:18px;background:#1E1D1B"></span><span style="height:58px;border-radius:18px;background:#1E1D1B;margin-left:28px"></span><span style="height:58px;border-radius:18px;background:#FFD43B;margin-left:56px;opacity:0.9"></span>
</div>
</section>

<section aria-labelledby="h-notes" style="display:flex;flex-direction:column;gap:14px;padding-top:6px">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><h2 id="h-notes" style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:30px;font-weight:700;letter-spacing:-0.02em">My notes</h2><span style="font-size:13.5px;font-weight:600;color:#6A665F">Only visible to you</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px">
<article style="min-height:220px;box-sizing:border-box;padding:24px;border-radius:26px;background:#FFD43B;display:flex;flex-direction:column;gap:10px">
<h3 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em">Things to do</h3>
<p style="margin:0;flex:1;font-size:15px;line-height:1.55">LOrem impsum</p>
<p style="margin:0;font-size:13px;font-weight:600;color:#4D3B00">in less than a minute</p>
</article>
<button type="button" style="min-height:220px;border-radius:26px;border:1.5px dashed #CFCAC0;background:transparent;color:#121212;font-family:inherit;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer"><span style="width:52px;height:52px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>New note</button>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
