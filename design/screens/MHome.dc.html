<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div style="position:absolute;left:0;bottom:0;z-index:2"><dc-import name="MTabBar" active="home" hint-size="390px,96px"></dc-import></div>
<div style="height:844px;overflow-y:auto;box-sizing:border-box;padding:56px 18px 120px;display:flex;flex-direction:column;gap:18px">

<div style="display:flex;align-items:center;gap:10px">
<span style="width:40px;height:40px;border-radius:12px;background:#FFD43B;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;font-weight:800;letter-spacing:-0.05em">wc</span>
<span style="flex:1"></span>
<a href="MMore.dc.html" aria-label="Search" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg></a>
<button type="button" aria-label="Notifications, unread" style="position:relative;width:44px;height:44px;border:0;border-radius:50%;background:#FFFFFF;color:#121212;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#C0362C;border:2px solid #FFFFFF"></span></button>
<a href="MSettings.dc.html" aria-label="Your settings" style="width:44px;height:44px;border-radius:50%;background:#121212;color:#FFD43B;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none">OI</a>
</div>

<div style="display:flex;flex-direction:column;gap:6px;padding:4px 2px">
<p style="margin:0;font-size:14px;font-weight:600;color:#6A665F">Saturday, October 24</p>
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:40px;line-height:1;font-weight:700;letter-spacing:-0.04em">Good afternoon, Olubukola.</h1>
</div>


<section aria-labelledby="mh-needs" style="padding:20px;border-radius:26px;background:#121212;color:#FFFFFF;display:flex;flex-direction:column;gap:6px">
<h2 id="mh-needs" style="margin:0 0 6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;font-weight:700">Needs you</h2>
<sc-for list="{{attention}}" as="a" hint-placeholder-count="4">
<a href="{{a.href}}" style="display:flex;align-items:center;gap:14px;min-height:52px;border-top:1px solid #2A2926;text-decoration:none;color:#FFFFFF">
<span style="flex:none;width:30px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:700;color:#FFD43B">{{a.count}}</span>
<span style="flex:1;font-size:14.5px;font-weight:600">{{a.label}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A49C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</a>
</sc-for>
</section>

<section aria-labelledby="mh-ts" style="display:flex;flex-direction:column;gap:10px">
<h2 id="mh-ts" style="margin:6px 2px 0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700">Task status</h2>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{status}}" as="s" hint-placeholder-count="4">
<a href="MTasks.dc.html" style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:22px;background:{{s.bg}};color:{{s.fg}};text-decoration:none">
<span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:36px;line-height:1;font-weight:700">{{s.value}}</span>
<span style="font-size:13.5px;font-weight:600">{{s.label}}</span>
</a>
</sc-for>
</div>
</section>

<section aria-labelledby="mh-mt" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0"><h2 id="mh-mt" style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700">My tasks</h2><a href="MTasks.dc.html" style="font-size:14px;font-weight:600;padding:10px 0">See all</a></div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;padding:12px 10px 12px 16px;border-radius:22px;background:#FFFFFF;color:#121212">
<span style="flex:none;width:10px;height:10px;border-radius:50%;background:#C0362C;box-shadow:0 0 0 4px #FBE7E4"></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15.5px;font-weight:700">{{t.title}}</span><span style="font-size:12.5px;color:#4D4A44"><span style="font-weight:600;color:#121212">Start</span> {{t.start}}</span><span style="font-size:12.5px;color:#C0362C"><span style="font-weight:600">Deadline</span> {{t.due}} · missed</span></span>
<span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;font-weight:600;color:#4D4A44">{{t.spent}}</span>
<button type="button" aria-label="Edit {{t.title}}" style="flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#EFEDE7;color:#121212;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
<button type="button" aria-label="Delete {{t.title}}" style="flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#FBE7E4;color:#C0362C;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg></button>
</div>
</sc-for>
</section>

<section aria-labelledby="mh-pp" style="display:flex;flex-direction:column;gap:10px">
<h2 id="mh-pp" style="margin:6px 2px 0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:700">Projects</h2>
<a href="MProjects.dc.html" style="display:flex;border-radius:22px;background:#FFFFFF;text-decoration:none;color:#121212;overflow:hidden">
<sc-for list="{{pipeline}}" as="p" hint-placeholder-count="3"><span style="flex:1;display:flex;flex-direction:column;gap:4px;padding:16px;border-right:1px solid #ECEAE4"><span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:30px;line-height:1;font-weight:700">{{p.n}}</span><span style="font-size:13px;font-weight:600;color:#4D4A44">{{p.label}}</span></span></sc-for>
</a>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      attention: [
        { count: '1', label: 'Deadline extension to decide', href: 'MTasks.dc.html' },
        { count: '2', label: 'Leave applications pending', href: 'MPeople.dc.html' },
        { count: '2', label: 'Client complaints pending', href: 'MClients.dc.html' },
        { count: '1', label: 'Staff complaint pending', href: 'MPeople.dc.html' }
      ],
      status: [
        { label: 'In review', value: '181', bg: '#121212', fg: '#FFD43B' },
        { label: 'To do', value: '1', bg: '#FFFFFF', fg: '#121212' },
        { label: 'In progress', value: '0', bg: '#FFFFFF', fg: '#121212' },
        { label: 'Pending', value: '0', bg: '#FFFFFF', fg: '#121212' }
      ],
      tasks: [
        { title: 'New UI', start: 'Oct 20, 8:41 AM', due: 'Oct 20, 9:08 AM', spent: '00:29:43' },
        { title: 'indigo', start: 'Oct 20, 2:19 PM', due: 'Oct 20, 2:22 PM', spent: '00:00:00' },
        { title: 'fed1', start: 'Oct 19, 8:23 AM', due: 'Oct 19, 8:25 AM', spent: '00:02:08' }
      ],
      pipeline: [ { n: '0', label: 'Active' }, { n: '48', label: 'Pending' }, { n: '4', label: 'Completed' } ]
    };
  }
}
</script>
</body>
</html>
