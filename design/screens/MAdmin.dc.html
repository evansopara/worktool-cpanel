<sc-for list="{{users}}" as="u" hint-placeholder-count="7">
<article style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:#FFFFFF">
<div style="display:flex;align-items:center;gap:12px"><span style="flex:none;width:44px;height:44px;border-radius:50%;background:{{u.abg}};color:{{u.afg}};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">{{u.ini}}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:15.5px;font-weight:700">{{u.name}}</span><span style="font-size:12.5px;color:#6A665F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{u.email}}</span></span><span style="flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:{{u.sbg}};color:{{u.sfg}}"><span style="width:6px;height:6px;border-radius:50%;background:{{u.dot}}"></span>{{u.status}}</span></div>
<div style="display:flex;align-items:center;gap:8px">
<label style="flex:1;min-width:0;display:flex;align-items:center;height:44px;padding:0 6px 0 14px;border-radius:999px;background:#F7F6F2"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Role for {{u.name}}</span><select style="flex:1;min-width:0;height:40px;border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:#121212"><option>{{u.role}}</option></select></label>
<button type="button" aria-label="Reset password for {{u.name}}" style="flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#EFEDE7;color:#121212;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 7.5l3 3M21 2l-9.6 9.6M7.5 21a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM15.5 7.5L19 4"></path></svg></button>
<sc-if value="{{u.canDeactivate}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Deactivate {{u.name}}" style="flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#FBE7E4;color:#C0362C;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 8l5 5M22 8l-5 5"></path></svg></button></sc-if>
</div>
<span style="font-size:12px;color:#6A665F">@{{u.user}} · joined {{u.joined}}</span>
</article>
</sc-for>

</div>
</div>
</x-dc>
