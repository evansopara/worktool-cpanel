<span style="display:flex;flex-direction:column;gap:2px"><span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px;font-weight:700">{{h.label}}</span><span style="font-size:12.5px;opacity:0.75">{{h.sub}}</span></span>
<sc-if value="{{h.badge}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:14px;right:14px;min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#FFD43B;color:#121212;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{h.badge}}</span></sc-if>

<label style="display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;border-bottom:1px solid #F2F0EB"><span style="flex:1;font-size:15px;font-weight:600">Dark mode</span><input type="checkbox" role="switch" style="width:46px;height:26px;accent-color:#121212"></label>
<button type="button" style="display:flex;align-items:center;min-height:56px;padding:0 16px;border:0;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:600;color:#C0362C;text-align:left">Sign out</button>

</div>
</div>
