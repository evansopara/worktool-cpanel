<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-label="Search and commands" style="width:760px;height:560px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;border-radius:28px;overflow:hidden;font-family:'Geist',system-ui,sans-serif;color:#121212;box-shadow:0 30px 80px rgba(18,18,18,0.18)">
<label style="display:flex;align-items:center;gap:14px;padding:22px 26px;border-bottom:1px solid #ECEAE4">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
<input type="search" aria-label="Search everything" value="lea" style="flex:1;border:0;outline:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;font-weight:600;color:#121212;background:transparent">
<kbd style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;background:#EFEDE7;color:#4D4A44">esc</kbd>
</label>
<div style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:2px">
<p style="margin:0;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#6A665F">{{g.label}}</p>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
<a href="{{i.href}}" style="display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 14px;border-radius:16px;text-decoration:none;color:{{i.fg}};background:{{i.bg}}">
<span style="flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:{{i.ibg}};color:{{i.ifg}};font-size:13px;font-weight:700">{{i.ini}}</span>
<span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600">{{i.title}}</span><span style="font-size:13px;opacity:0.75">{{i.sub}}</span></span>
<sc-if value="{{i.hint}}" hint-placeholder-val="{{ false }}"><kbd style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;background:#FFD43B;color:#121212">↵</kbd></sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid #ECEAE4;background:#F7F6F2">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4"><button type="button" style="height:40px;padding:0 16px;border:0;border-radius:999px;background:#FFFFFF;color:#121212;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer">{{a}}</button></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    function it(title, sub, ini, href, first) { return { title: title, sub: sub, ini: ini, href: href, hint: !!first, bg: first ? '#121212' : 'transparent', fg: first ? '#FFFFFF' : '#121212', ibg: first ? '#FFD43B' : '#EFEDE7', ifg: '#121212' }; }
    return {
      groups: [
        { label: 'Pages', items: [ it('Leave', 'People › Leave · 2 pending', 'L', 'People.dc.html', true) ] },
        { label: 'Leave applications', items: [
          it('Linda Ekeh', 'Annual · Jun 2 – Jun 3, 2026 · Pending', 'LE', 'People.dc.html'),
          it('Temitayo Akintunde', 'Annual · May 25 – May 29, 2026 · Pending', 'TA', 'People.dc.html'),
          it('Mirakl', 'Leave of Absence · Apr 1 – Apr 7, 2026 · Approved', 'MI', 'People.dc.html')
        ] }
      ],
      actions: ['New task', 'New memo', 'Schedule meeting', 'Send query']
    };
  }
}
</script>
</body>
</html>
