<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}a:hover{color:#000000}
@media (min-width: 900px){.wc-side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div class="wc-side" style="flex:1 1 248px;background:#121212"><dc-import name="Topbar" active="admin" hint-size="100%,1000px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:28px 40px 72px;display:flex;flex-direction:column;gap:22px">

<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding:8px 0 4px">
<div style="display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:56px;line-height:1;font-weight:700;letter-spacing:-0.04em">Admin</h1>
<p style="margin:0;font-size:16px;color:#4D4A44">Create accounts, set roles and control access</p>
</div>
<button type="button" style="display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border:0;border-radius:999px;background:#FFD43B;color:#121212;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create user</button>
</header>

<section aria-label="Accounts" style="display:flex;flex-wrap:wrap;gap:14px">
<div style="flex:1 1 220px;display:flex;align-items:center;gap:18px;padding:22px 26px;border-radius:26px;background:#121212;color:#FFFFFF"><span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:56px;line-height:0.9;font-weight:700;color:#FFD43B">41</span><span style="font-size:16px;font-weight:600">users total</span></div>
<div style="flex:1 1 220px;display:flex;align-items:center;gap:18px;padding:22px 26px;border-radius:26px;background:#FFFFFF"><span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:56px;line-height:0.9;font-weight:700">23</span><span style="font-size:16px;font-weight:600">active users</span></div>
</section>

<section aria-labelledby="h-users" style="background:#FFFFFF;border-radius:30px;padding:26px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-bottom:10px">
<h2 id="h-users" style="margin:0 auto 0 0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.02em">Active users</h2>
<label style="display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;background:#EFEDE7;min-width:260px;color:#6A665F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input type="search" aria-label="Search users" placeholder="Search users" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:14.5px;color:#121212"></label>
</div>
<sc-for list="{{users}}" as="u" hint-placeholder-count="7">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:14px 0;border-top:1px solid #ECEAE4">
<span style="flex:2.4 1 260px;min-width:0;display:flex;align-items:center;gap:12px"><span style="flex:none;width:42px;height:42px;border-radius:50%;background:{{u.abg}};color:{{u.afg}};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">{{u.ini}}</span><span style="min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:15.5px;font-weight:700">{{u.name}}</span><span style="font-size:13px;color:#6A665F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{u.email}} · @{{u.user}}</span></span></span>
<label style="flex:1.4 1 190px;display:flex;align-items:center;height:42px;padding:0 6px 0 16px;border-radius:999px;background:#F7F6F2"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Role for {{u.name}}</span><select style="flex:1;height:38px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:#121212;cursor:pointer"><option>{{u.role}}</option></select></label>
<span style="flex:0 0 96px;display:flex"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:{{u.sbg}};color:{{u.sfg}}"><span style="width:7px;height:7px;border-radius:50%;background:{{u.dot}}"></span>{{u.status}}</span></span>
<span style="flex:1 1 120px;font-size:13.5px;color:#6A665F">Joined {{u.joined}}</span>
<span style="flex:none;display:flex;gap:6px">
<button type="button" aria-label="Reset password for {{u.name}}" style="width:42px;height:42px;border:0;border-radius:50%;background:#EFEDE7;color:#121212;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 7.5l3 3M21 2l-9.6 9.6M7.5 21a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM15.5 7.5L19 4"></path></svg></button>
<sc-if value="{{u.canDeactivate}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Deactivate {{u.name}}" style="width:42px;height:42px;border:0;border-radius:50%;background:#FBE7E4;color:#C0362C;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 8l5 5M22 8l-5 5"></path></svg></button></sc-if>
</span>
</div>
</sc-for>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    var st = { active: ['#E2F2E7', '#1F7A4A', '#1F9D57'], online: ['#DCE6F7', '#1E4797', '#2457C5'], offline: ['#ECEAE4', '#4D4A44', '#8E8A82'] };
    var pal = [['#FFD43B', '#121212'], ['#121212', '#FFD43B'], ['#DCE6F7', '#1E4797'], ['#E2F2E7', '#1F7A4A']];
    var k = 0;
    function u(name, ini, email, user, role, status, joined, canDeactivate) {
      var c = pal[k++ % 4];
      return { name: name, ini: ini, email: email, user: user, role: role, status: status.charAt(0).toUpperCase() + status.slice(1), sbg: st[status][0], sfg: st[status][1], dot: st[status][2], joined: joined, canDeactivate: canDeactivate !== false, abg: c[0], afg: c[1] };
    }
    return { users: [
      u('Adeleke Toyin', 'AT', 'adelekedewunmi@gmail.com', 'Toyeen', 'Project manager', 'active', 'about 1 year ago'),
      u('Adeyemo Titilope', 'AT', 'titilopeadeyemoskills@gmail.com', 'Titilope', 'Customer support officer', 'online', 'about 1 year ago'),
      u('Aliyah Yisau', 'AY', 'aliyahtolorunlashe@gmail.com', 'Aliyah', 'Project manager', 'active', '8 months ago'),
      u('Asheoluwa Oke', 'AO', 'asheoluwaoke@gmail.com', 'Asheoluwa Oke', 'Staff', 'online', 'about 1 year ago'),
      u('Blank account', 'BA', 'lightweight324@gmail.com', 'Blank', 'Staff', 'active', 'about 1 year ago'),
      u('Dummy teamlead', 'DT', 'lightweight324+id31@gmail.com', 'Dummy teamlead', 'Team lead', 'online', '10 months ago', false),
      u('Dummy pm', 'DP', 'lightweight324+id33@gmail.com', 'Dummy pm', 'Project manager', 'offline', '9 months ago')
    ] };
  }
}
</script>
</body>
</html>
