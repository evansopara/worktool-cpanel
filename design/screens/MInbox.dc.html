<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#121212}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#EFEDE7;font-family:'Geist',system-ui,sans-serif;color:#121212">
<div style="position:absolute;left:0;bottom:0;z-index:2"><dc-import name="MTabBar" active="inbox" hint-size="390px,96px"></dc-import></div>
<div style="height:844px;overflow-y:auto;box-sizing:border-box;padding:56px 18px 120px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;justify-content:space-between">
<h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:40px;line-height:1;font-weight:700;letter-spacing:-0.04em">Inbox</h1>
<button type="button" aria-label="{{newLabel}}" style="width:48px;height:48px;border:0;border-radius:50%;background:#FFD43B;color:#121212;display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
</div>

<div role="tablist" aria-label="Inbox sections" style="display:flex;padding:5px;border-radius:999px;background:#FFFFFF">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="flex:1;height:40px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</button></sc-for>
</div>

<sc-if value="{{isChats}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:12px">
<label style="display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:999px;background:#FFFFFF;color:#6A665F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input type="search" aria-label="Search people and chats" placeholder="Search people and chats" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:15px;color:#121212"></label>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<section style="display:flex;flex-direction:column;gap:2px">
<h2 style="margin:4px 6px;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#6A665F">{{sec.label}}</h2>
<div style="display:flex;flex-direction:column;border-radius:24px;background:#FFFFFF;overflow:hidden">
<sc-for list="{{sec.items}}" as="c" hint-placeholder-count="3">
<a href="{{c.href}}" style="display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border-bottom:1px solid #F2F0EB;text-decoration:none;color:#121212">
<span style="flex:none;width:46px;height:46px;border-radius:{{c.radius}};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:{{c.abg}};color:{{c.afg}}">{{c.ini}}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.title}}</span><span style="flex:none;font-size:12px;color:#6A665F">{{c.time}}</span></span><span style="font-size:13.5px;color:#4D4A44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.sub}}</span></span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isMemos}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:12px">
<div role="group" aria-label="Memo type" style="display:flex;gap:8px;overflow-x:auto">
<sc-for list="{{memoChips}}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{c.on}}" style="flex:none;height:38px;padding:0 14px;border:0;border-radius:999px;font-family:inherit;font-size:13.5px;font-weight:600;background:{{c.bg}};color:{{c.fg}}">{{c.label}}</button></sc-for>
</div>
<sc-for list="{{memos}}" as="m" hint-placeholder-count="3">
<article style="display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;background:#FFFFFF">
<div style="display:flex;align-items:center;gap:12px"><span style="flex:none;width:42px;height:42px;border-radius:14px;background:{{m.bg}};color:{{m.fg}};display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM3 7l9 6 9-6"></path></svg></span><h2 style="margin:0;flex:1;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px;line-height:1.15;font-weight:700">{{m.title}}</h2></div>
<p style="margin:0;font-size:13.5px;color:#4D4A44">Individual · From Olubukola Ige · To {{m.to}}</p>
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:12.5px;color:#6A665F">{{m.date}}</span><button type="button" style="height:40px;padding:0 16px;border:0;border-radius:999px;background:#EFEDE7;color:#121212;font-family:inherit;font-size:13.5px;font-weight:600">Read</button></div>
</article>
</sc-for>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'chats' }; }
  renderVals() {
    var self = this, tab = this.state.tab;
    function mk(id, label) { var on = tab === id; return { label: label, sel: on ? 'true' : 'false', bg: on ? '#121212' : 'transparent', fg: on ? '#FFFFFF' : '#4D4A44', pick: function () { self.setState({ tab: id }); } }; }
    function chip(l, on) { return { label: l, on: on ? 'true' : 'false', bg: on ? '#121212' : '#FFFFFF', fg: on ? '#FFFFFF' : '#4D4A44' }; }
    var pal = [['#FFD43B', '#121212'], ['#121212', '#FFD43B'], ['#DCE6F7', '#1E4797'], ['#E2F2E7', '#1F7A4A'], ['#FCF0CC', '#8A5A00']];
    function c(title, sub, time, ini, i, dm, href) { return { title: title, sub: sub, time: time, ini: ini, abg: pal[i % 5][0], afg: pal[i % 5][1], radius: dm ? '50%' : '15px', href: href || 'MInbox.dc.html' }; }
    return {
      tabs: [ mk('chats', 'Chats'), mk('memos', 'Memos') ],
      isChats: tab === 'chats', isMemos: tab === 'memos',
      newLabel: tab === 'memos' ? 'New memo' : 'New message',
      sections: [
        { label: 'Channels', items: [ c('General channel', 'OLAEGBE: Noted', '9 mo', '#', 0, false), c('QueenbodySecret', 'Sandra Mike: What is the update?', '11:02', 'QS', 1, false, 'MChat.dc.html') ] },
        { label: 'Direct messages', items: [
          c('Yakubu Halilullah Omeiza', 'Kindly ignore. I’ve gotten a feedback.', '10 mo', 'YH', 2, true),
          c('Adeleke Toyin', 'Project Manager', '', 'AT', 3, true), c('Adeyemo Titilope', 'Customer Support Officer', '', 'AT', 4, true),
          c('Aliyah Yisau', 'Project Manager', '', 'AY', 0, true), c('Asheoluwa Oke', 'Staff', '', 'AO', 1, true),
          c('Blank account', 'Staff', '', 'BA', 2, true), c('Dummy teamlead', 'Team Lead', '', 'DT', 3, true),
          c('Dummy pm', 'Project Manager', '', 'DP', 4, true), c('Emmanuel Evans', 'Staff', '', 'EE', 0, true),
          c('Enyojo Wisdom Etu', 'Intern', '', 'EW', 1, true), c('Godwin Joel', 'Intern', '', 'GJ', 2, true)
        ] }
      ],
      memoChips: [ chip('All memos', true), chip('Individual', false), chip('Department', false), chip('Broadcast', false) ],
      memos: [
        { title: 'Warning', to: '—', date: 'Mar 4, 2026 · 3:50 PM', bg: '#FBE7E4', fg: '#C0362C' },
        { title: 'MISSED TASK DEADLINE', to: '—', date: 'Jan 16, 2026 · 3:31 PM', bg: '#FCF0CC', fg: '#8A5A00' },
        { title: 'MISSED TASKS DEADLINES', to: 'Asheoluwa Oke', date: 'Jan 16, 2026 · 3:28 PM', bg: '#FCF0CC', fg: '#8A5A00' }
      ]
    };
  }
}
</script>
</body>
</html>
