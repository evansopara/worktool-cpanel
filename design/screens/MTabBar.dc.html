<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:96px;box-sizing:border-box;padding:0 16px 24px;display:flex;align-items:flex-end;font-family:'Geist',system-ui,sans-serif">
<nav aria-label="Main" style="flex:1;height:66px;box-sizing:border-box;padding:6px;display:flex;gap:2px;border-radius:999px;background:#121212;box-shadow:0 12px 30px rgba(18,18,18,0.28)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.cur}}" style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:999px;text-decoration:none;background:{{t.bg}};color:{{t.fg}}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span style="font-size:10.5px;font-weight:600">{{t.label}}</span>
<sc-if value="{{t.badge}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:5px;right:12px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#FFD43B;color:#121212;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{t.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","projects","tasks","inbox","more"],"default":"home"},"role":{"editor":"enum","options":["manager","staff"],"default":"manager"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active ?? 'home';
    var staff = (this.props.role ?? 'manager') === 'staff';
    function t(k, label, href, d, badge) { var on = k === a; return { label: label, href: href, d: d, badge: on ? '' : (badge || ''), cur: on ? 'page' : 'false', bg: on ? '#FFD43B' : 'transparent', fg: on ? '#121212' : '#C9C5BC' }; }
    return { tabs: [
      t('home', 'Home', staff ? 'MStaffHome.dc.html' : 'MHome.dc.html', 'M3 10l9-7 9 7v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z'),
      t('projects', 'Projects', 'MProjects.dc.html', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'),
      t('tasks', 'Tasks', staff ? 'MStaffTasks.dc.html' : 'MTasks.dc.html', 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', '1'),
      t('inbox', 'Inbox', 'MInbox.dc.html', 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z'),
      t('more', 'More', 'MMore.dc.html', 'M5 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM19 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z', '5')
    ] };
  }
}
</script>
</body>
</html>
